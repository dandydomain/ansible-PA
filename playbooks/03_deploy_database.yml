---
- name: Deployment Database Server
  hosts: dbservers
  become: true
  gather_facts: false

  vars_files:
    - ../group_vars/all.yml

  vars:
    db_password: "{{ hostvars['localhost']['db_password_runtime'] }}"

  tasks:
    - name: Instal MariaDB Server
      ansible.builtin.apt:
        name:
          - mariadb-server
          - mariadb-client
        state: present
        update_cache: true
        install_recommends: false

    - name: Aktifkan MariaDB
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: Izinkan MariaDB menerima koneksi dari jaringan internal
      ansible.builtin.lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^\s*bind-address\s*='
        line: 'bind-address = 0.0.0.0'
      notify: Restart MariaDB

    - name: Buat skrip inisialisasi database
      ansible.builtin.template:
        src: ../templates/init-appdb.sql.j2
        dest: /root/init-appdb.sql
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Terapkan inisialisasi database satu kali
      ansible.builtin.shell: |
        set -e
        mariadb < /root/init-appdb.sql
        touch /var/lib/dandy-app-initialized
      args:
        creates: /var/lib/dandy-app-initialized
      no_log: true

  handlers:
    - name: Restart MariaDB
      ansible.builtin.service:
        name: mariadb
        state: restarted
