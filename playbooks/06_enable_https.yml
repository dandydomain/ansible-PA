---
- name: Konfigurasi HTTPS pada Web Server
  hosts: webservers
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  vars:
    web_hostname: "{{ web_hostnames[inventory_hostname] }}"
    web_fqdn: "{{ web_hostname }}.{{ domain_name }}"

  tasks:

    - name: Tampilkan domain Web Server
      ansible.builtin.debug:
        msg: "Konfigurasi HTTPS untuk {{ web_fqdn }}"

    - name: Install Certbot dan plugin Apache
      ansible.builtin.apt:
        name:
          - certbot
          - python3-certbot-apache
        state: present
        update_cache: true

    - name: Tunggu DNS publik mengarah ke Web Server
      ansible.builtin.command:
        argv:
          - getent
          - ahostsv4
          - "{{ web_fqdn }}"
      register: dns_resolution
      until: ansible_host in dns_resolution.stdout
      retries: 20
      delay: 15
      changed_when: false

    - name: Tampilkan hasil resolusi DNS
      ansible.builtin.debug:
        var: dns_resolution.stdout_lines

    - name: Dapatkan sertifikat SSL Let's Encrypt
      ansible.builtin.command:
        argv:
          - certbot
          - --apache
          - --non-interactive
          - --agree-tos
          - --email
          - "{{ letsencrypt_email }}"
          - --redirect
          - -d
          - "{{ web_fqdn }}"
      args:
        creates: "/etc/letsencrypt/live/{{ web_fqdn }}/fullchain.pem"
      notify: Restart Apache

    - name: Validasi konfigurasi Apache setelah HTTPS
      ansible.builtin.command:
        cmd: apache2ctl configtest
      changed_when: false

    - name: Pastikan Apache aktif
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true

  handlers:

    - name: Restart Apache
      ansible.builtin.service:
        name: apache2
        state: restarted
